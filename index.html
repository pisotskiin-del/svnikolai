<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Музыкальная открытка с салютом</title>
<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
button {
  position: relative;
  z-index: 10;
  margin-top: 40vh;
  padding: 15px 30px;
  font-size: 20px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 1;
}
</style>
</head>

<canvas id="fireworks"></canvas>

window.addEventListener('resize', resize);
